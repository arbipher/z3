name: Canary Testing for Bindings and Packages
on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - "**"
jobs:
  setup:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        ocaml-version:
        - "5"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: setup (${{ matrix.os }})
    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.1
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Cache opam
      uses: actions/cache@v5
      with:
        path: ~/.opam
        key: ${{ runner.os }}-opam-${{ matrix.ocaml-version }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-opam-${{ matrix.ocaml-version }}-
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ matrix.ocaml-version }}
        opam-disable-sandboxing: true
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bubblewrap m4 libgmp-dev pkg-config ninja-build ccache
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install gmp pkg-config ninja ccache
    - name: Install required opam packages
      run: opam install -y ocamlfind zarith
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    steps:
    - name: Configure with CMake
      env:
        CC: ${{ matrix.os == 'macos-latest' && 'ccache clang' || 'ccache gcc' }}
        CXX: ${{ matrix.os == 'macos-latest' && 'ccache clang++' || 'ccache g++' }}
      run: "mkdir -p build\ncd build\neval $(opam env)\ncmake .. \\\n  -G Ninja \\\n
        \  \\\n  -DZ3_BUILD_LIBZ3_SHARED=ON \\\n  -DZ3_BUILD_OCAML_BINDINGS=ON \\\n
        \ -DZ3_BUILD_JAVA_BINDINGS=OFF \\\n  -DZ3_BUILD_PYTHON_BINDINGS=OFF \\\n  -DZ3_BUILD_EXECUTABLE=OFF
        \\\n  -DZ3_BUILD_TEST_EXECUTABLES=OFF \\\n  -DCMAKE_VERBOSE_MAKEFILE=TRUE
        \n"
    - name: Build Z3 and OCaml bindings
      run: "eval $(opam env)\n  cd build\n  ninja build_z3_ocaml_bindings \n"
    - name: Compile ml_example.byte
      run: |
        eval $(opam env)
        ocamlfind ocamlc -o ml_example.byte \
          -package zarith \
          -linkpkg \
          -I build/src/api/ml \
          -dllpath build/src/api/ml \
          build/src/api/ml/z3ml.cma \
          examples/ml/ml_example.ml
    - name: Run ml_example.byte
      run: |
        eval $(opam env)
        export DYLD_LIBRARY_PATH=$(pwd)/build
        ocamlrun ./ml_example.byte
    - name: Compile ml_example (native)
      run: |
        eval $(opam env)
        ocamlfind ocamlopt -o ml_example \
          -package zarith \
          -linkpkg \
          -I build/src/api/ml \
          build/src/api/ml/z3ml.cmxa \
          examples/ml/ml_example.ml
    - name: Run ml_example (native)
      run: |
        export DYLD_LIBRARY_PATH=$(pwd)/build
        ./ml_example
